<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador Pokemon</title>

    <style>
        #imagen-pokemon {
            width: 500px;
        }

        #info-pokemon {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>Buscar Pokemon</h1>
    <input id="buscador" type="text">
    <p id="chiste"></p>
    <button id="boton">Buscar</button>

    <div id="info-pokemon">
        <h2 id="nombre-pokemon"></h2>
        <p id="altura-pokemon"></p>
        <p id="peso-pokemon"></p>
        <img id="imagen-pokemon" src="" alt="">
        <p id="tipos-pokemon"></p>
    </div>



    <script defer>

        const nombrePokemon = document.getElementById("nombre-pokemon");
        const alturaPokemon = document.getElementById("altura-pokemon");
        const pesoPokemon = document.getElementById("peso-pokemon");
        const imagenPokemon = document.getElementById("imagen-pokemon");
        const tiposPokemon = document.getElementById("tipos-pokemon");

        let input = document.getElementById("buscador")

        async function getPokemon() {

            let pokemonABuscar = input.value

            const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${pokemonABuscar}`);
            if (!res.ok) {
                return "ERROR AL CARGAR EL POKEMON"
            }
            else {
                const json = await res.json();
                return json
            }
        }

        function updateScreen(pokemonJSON) {
            nombrePokemon.innerText = pokemonJSON.name
            alturaPokemon.innerText = pokemonJSON.height
        }

        let boton = document.getElementById("boton")
        
        boton.addEventListener("click", async function () {
            let pokemon = await getPokemon()
            if (pokemon != "ERROR AL CARGAR EL POKEMON") {
                nombrePokemon.innerText = `Pokémon: ${pokemon.name}`
                pesoPokemon.innerText = `Peso: ${pokemon.weight}`
                alturaPokemon.innerText = "Altura: " + pokemon.height
                imagenPokemon.setAttribute("src", `${pokemon.sprites.front_default}`)
            }
            else {
                nombrePokemon.innerText = pokemon
                pesoPokemon.innerText = ""
                alturaPokemon.innerText = ""
                imagenPokemon.setAttribute("src", "")
            }
        })

    </script>
</body>

</html>
